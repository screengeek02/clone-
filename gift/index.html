<!doctype html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Gift | VitalSpring</title><link rel='stylesheet' href='/assets/css/styles.css'></head><body><main class='container section'><h1>Gift membership</h1><div class='grid-3'><div class='panel' style='padding:16px'>1) Choose plan</div><div class='panel' style='padding:16px'>2) Email delivery</div><div class='panel' style='padding:16px'>3) Redeem + schedule labs</div></div><form class='panel' style='max-width:560px;padding:18px;margin-top:16px' id='giftForm'><label>Recipient name<input id='giftName' required></label><label>Recipient email<input id='giftEmail' type='email' required></label><button class='btn btn-primary' type='submit'>Purchase gift</button><p id='giftMsg' class='small'></p></form></main><script src='/assets/js/app.js'></script><script>document.getElementById('giftForm').addEventListener('submit',e=>{e.preventDefault();const n=giftName.value.trim();const m=/\S+@\S+\.\S+/.test(giftEmail.value);giftMsg.textContent=n&&m?'Gift order staged (demo only).':'Please enter valid details.'});</script></body></html>
