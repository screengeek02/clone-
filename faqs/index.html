<!doctype html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>FAQs | VitalSpring</title><link rel='stylesheet' href='/assets/css/styles.css'></head><body><main class='container section'><h1>FAQs</h1><input id='faqSearch' placeholder='Search FAQs'><div id='faqList'><div class='faq-item panel' data-t='membership included testing cadence'><button aria-expanded='false'>What is included?<span>+</span></button><div class='faq-content'>Biomarker testing cadence, insights, and clinician guidance.</div></div><div class='faq-item panel' data-t='results one week'><button aria-expanded='false'>When do results arrive?<span>+</span></button><div class='faq-content'>Most panels return in about one week.</div></div><div class='faq-item panel' data-t='billing cancel anytime'><button aria-expanded='false'>Can I cancel?<span>+</span></button><div class='faq-content'>Yes, anytime through billing settings.</div></div></div></main><script src='/assets/js/app.js'></script><script>faqSearch?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#faqList .faq-item').forEach(i=>i.style.display=i.dataset.t.includes(q)?'block':'none')})</script></body></html>
