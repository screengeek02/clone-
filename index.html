<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentine Envelope Card</title>
  <style>
    :root {
      --bg-top: #241f3a;
      --bg-bottom: #1e1c2d;
      --paper: #fff;
      --line: rgba(0, 0, 0, 0.35);
      --frame: rgba(255, 255, 255, 0.28);
      --ease: cubic-bezier(.22, .9, .2, 1);
      --env-w: min(360px, 72vw);
      --env-h: calc(var(--env-w) * 0.62);
      --card-w: calc(var(--env-w) * 0.74);
      --card-h: calc(var(--env-h) * 1.6);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .frame {
      width: min(840px, 92vw);
      height: min(940px, 92vh);
      border: 2px solid var(--frame);
      display: grid;
      place-items: start center;
      padding-top: 11vh;
    }

    .scene {
      perspective: 1200px;
      position: relative;
      width: var(--env-w);
      height: calc(var(--env-h) + 240px);
    }

    .envelope {
      position: absolute;
      inset: 0;
      width: var(--env-w);
      height: var(--env-h);
      margin: 0 auto;
      transform-style: preserve-3d;
      cursor: pointer;
      outline: none;
    }

    .base {
      position: absolute;
      inset: 0;
      background: var(--paper);
      box-shadow: 0 24px 56px rgba(0, 0, 0, 0.4);
      z-index: 1;
    }

    .pocket {
      position: absolute;
      inset: 0;
      z-index: 4;
      background: var(--paper);
    }

    .pocket::before,
    .pocket::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .42;
    }

    .pocket::before {
      background: linear-gradient(135deg, transparent 49.5%, var(--line) 50%, transparent 50.5%);
    }

    .pocket::after {
      background: linear-gradient(225deg, transparent 49.5%, var(--line) 50%, transparent 50.5%);
    }

    .flap {
      position: absolute;
      inset: 0;
      background: var(--paper);
      clip-path: polygon(0 0, 100% 0, 50% 56%);
      transform-origin: top;
      transform: rotateX(0deg) translateZ(8px);
      transition: transform 680ms var(--ease), box-shadow 680ms var(--ease);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.14);
      z-index: 6;
    }

    .card-wrap {
      position: absolute;
      left: 50%;
      width: var(--card-w);
      height: var(--card-h);
      transform: translateX(-50%) translateY(84px);
      transform-style: preserve-3d;
      transition: transform 900ms var(--ease);
      z-index: 3;
    }

    .card {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }

    .panel {
      position: absolute;
      top: 0;
      bottom: 0;
      background: #fff;
      border: 1px solid rgba(0, 0, 0, 0.13);
      backface-visibility: hidden;
    }

    .center {
      left: 0;
      width: 100%;
      display: grid;
      place-items: center;
      padding: 18px;
      text-align: center;
    }

    .cover-top,
    .cover-bottom {
      font-size: 12px;
      letter-spacing: 4px;
      opacity: .65;
      font-weight: 700;
    }

    .cover-script {
      font-family: "Brush Script MT", "Segoe Script", cursive;
      font-size: clamp(30px, 5vw, 44px);
      color: #111;
      margin: 6px 0;
    }

    .inside {
      position: absolute;
      inset: 0;
      display: grid;
      align-content: center;
      padding: 22px;
      gap: 10px;
      opacity: 0;
      transition: opacity 350ms ease;
      text-align: center;
    }

    .inside p {
      margin: 0;
      font-size: 13px;
      line-height: 1.35;
      color: #1a1a1a;
    }

    .left,
    .right {
      width: 50%;
      transition: transform 900ms var(--ease);
      transform-style: preserve-3d;
      z-index: 2;
    }

    .left {
      left: 0;
      transform-origin: left;
    }

    .right {
      right: 0;
      transform-origin: right;
    }

    .envelope.is-flap-open .flap {
      transform: rotateX(170deg) translateZ(8px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .envelope.is-card-out .card-wrap {
      transform: translateX(-50%) translateY(-126px);
    }

    .envelope.is-card-open .left {
      transform: rotateY(-170deg);
    }

    .envelope.is-card-open .right {
      transform: rotateY(170deg);
    }

    .envelope.is-card-open .inside {
      opacity: 1;
      transition-delay: 150ms;
    }

    .envelope.is-card-open .cover {
      opacity: 0;
      transition: opacity 220ms ease;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <section class="scene">
      <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open or close Valentine card" aria-pressed="false">
        <div class="base"></div>

        <div class="card-wrap">
          <article class="card">
            <section class="panel center">
              <div class="cover">
                <div class="cover-top">HAPPY</div>
                <div class="cover-script">Valentine's</div>
                <div class="cover-bottom">DAY</div>
              </div>
              <div class="inside" aria-hidden="true">
                <p><strong>To my love,</strong></p>
                <p>Thank you for being my favorite person and my forever smile.</p>
                <p>Happy Valentine's Day.</p>
              </div>
            </section>
            <section class="panel left" aria-hidden="true"></section>
            <section class="panel right" aria-hidden="true"></section>
          </article>
        </div>

        <div class="pocket"></div>
        <div class="flap"></div>
      </div>
    </section>
  </main>

  <script>
    const envelope = document.getElementById('envelope');
    let open = false;
    let busy = false;

    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    async function openEnvelope() {
      if (busy) return;
      busy = true;
      envelope.classList.add('is-flap-open');
      await wait(520);
      envelope.classList.add('is-card-out');
      await wait(520);
      envelope.classList.add('is-card-open');
      open = true;
      envelope.setAttribute('aria-pressed', 'true');
      busy = false;
    }

    async function closeEnvelope() {
      if (busy) return;
      busy = true;
      envelope.classList.remove('is-card-open');
      await wait(360);
      envelope.classList.remove('is-card-out');
      await wait(520);
      envelope.classList.remove('is-flap-open');
      open = false;
      envelope.setAttribute('aria-pressed', 'false');
      busy = false;
    }

    function toggle() {
      if (open) closeEnvelope();
      else openEnvelope();
    }

    envelope.addEventListener('click', toggle);
    envelope.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        toggle();
      }
    });
  </script>
</body>
</html>
