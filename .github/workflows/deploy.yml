name: Deploy to VPS/Plesk

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /var/www/vhosts/your-domain/httpdocs
            git pull origin main
            npm ci --omit=dev
            npm run build

            # For Plesk Node.js apps, app.js is the startup file.
            # Restart app from Plesk panel, or run your process manager restart command.
            # Example for Passenger-based apps:
            # mkdir -p tmp && touch tmp/restart.txt
